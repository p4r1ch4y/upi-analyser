# Builds signed APKs and attaches them to a GitHub release when a v* tag is pushed.
#
# The signing key never enters the repository. Add these under
# Settings -> Secrets and variables -> Actions:
#
#   ANDROID_KEYSTORE_BASE64    output of `base64 -w0 spendlens-release.jks`
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_ALIAS
#   ANDROID_KEY_PASSWORD
#
# Without them the build still runs and produces unsigned APKs, which cannot be
# installed — so the release step checks and says so rather than publishing
# something that looks fine and fails on the user's phone.

name: Release

on:
  push:
    tags:
      - "v*"
  # Re-run a release from an existing tag, using the workflow on the branch it
  # is dispatched from. A tag-triggered run uses the workflow as it was in the
  # tagged commit, so when that copy is broken this is the way to rebuild the
  # release without moving a published tag.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and release, e.g. v0.1.6-alpha"
        required: true

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up the Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The default also installs the legacy "tools" package, which current
          # command-line tools no longer offer, and the step then fails. The
          # build fetches the platforms and build-tools it needs by itself.
          packages: platform-tools

      - name: Test and lint
        run: ./gradlew --no-daemon test lint

      - name: Restore the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          # Checked here rather than in an `if:` expression: the `secrets`
          # context is not available in a step-level condition, and using it
          # there makes the entire workflow file invalid — GitHub then fails the
          # run in 0s with no log to read.
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "No signing key configured — the build will produce unsigned APKs."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > spendlens-release.jks
          {
            echo "storeFile=spendlens-release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties

      - name: Assemble release APKs
        run: ./gradlew --no-daemon assembleStandardRelease assembleFullRelease

      - name: Collect and checksum
        id: collect
        run: |
          mkdir -p dist
          for f in $(find app/build/outputs/apk -name "*release*.apk"); do
            cp "$f" "dist/SpendLens-${RELEASE_TAG}-$(basename "$f")"
          done
          cd dist && sha256sum *.apk > SHA256SUMS.txt && cat SHA256SUMS.txt
          # An unsigned APK cannot be installed. Better to fail loudly here than
          # to publish a download that dies on the user's phone.
          if ls *unsigned*.apk >/dev/null 2>&1; then
            echo "::error::APKs are unsigned — set the ANDROID_KEYSTORE_* secrets."
            exit 1
          fi

      - name: Remove key material
        if: always()
        run: rm -f keystore.properties spendlens-release.jks

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.apk
            dist/SHA256SUMS.txt
          tag_name: ${{ env.RELEASE_TAG }}
          body_path: .github/RELEASE_TEMPLATE.md
          draft: false
          prerelease: ${{ contains(env.RELEASE_TAG, 'alpha') || contains(env.RELEASE_TAG, 'beta') }}
