# Build, test, and publish signed APKs to a GitLab release on every version tag.
#
# The signing key never enters the repository. Set these as masked, protected
# CI/CD variables (Settings -> CI/CD -> Variables):
#
#   ANDROID_KEYSTORE_BASE64   File-type variable, or paste of `base64 -w0 spendlens-release.jks`
#   ANDROID_KEYSTORE_PASSWORD Masked
#   ANDROID_KEY_ALIAS         Masked
#   ANDROID_KEY_PASSWORD      Masked
#
# Mark them **Protected** and protect the `v*` tag pattern, so the key is only
# ever exposed to a pipeline running on a tag you created.
#
# Without those variables the build still produces unsigned APKs — which is
# exactly what F-Droid wants, since it signs with its own key. Note that an
# unsigned APK cannot be installed, so a release cut without the key configured
# would publish a broken download.

stages:
  - test
  - build
  - release

default:
  image: eclipse-temurin:21-jdk
  before_script:
    - apt-get update -qq && apt-get install -y -qq unzip wget >/dev/null
    - export ANDROID_HOME="$PWD/.android-sdk"
    - mkdir -p "$ANDROID_HOME/cmdline-tools"
    - |
      if [ ! -d "$ANDROID_HOME/cmdline-tools/latest" ]; then
        wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O /tmp/tools.zip
        unzip -q /tmp/tools.zip -d "$ANDROID_HOME/cmdline-tools"
        mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
      fi
    - export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
    - yes | sdkmanager --licenses >/dev/null 2>&1 || true
    - sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" >/dev/null
    - echo "sdk.dir=$ANDROID_HOME" > local.properties

cache:
  key: "$CI_COMMIT_REF_SLUG"
  paths:
    - .gradle/caches
    - .gradle/wrapper
    - .android-sdk

variables:
  GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle"

unit-tests:
  stage: test
  script:
    - ./gradlew --no-daemon test lint
  artifacts:
    when: always
    reports:
      junit:
        - "**/build/test-results/test/TEST-*.xml"
    paths:
      - app/build/reports/lint-results-*.html
    expire_in: 1 week

assemble:
  stage: build
  script:
    # Reconstruct keystore.properties from CI variables when they exist. When
    # they do not, the build leaves the APKs unsigned rather than falling back
    # to the debug key.
    - |
      if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
        echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > spendlens-release.jks
        printf 'storeFile=spendlens-release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
          "$ANDROID_KEYSTORE_PASSWORD" "$ANDROID_KEY_ALIAS" "$ANDROID_KEY_PASSWORD" > keystore.properties
        echo "Signing with the release key."
      else
        echo "No signing key configured — APKs will be unsigned."
      fi
    - ./gradlew --no-daemon assembleStandardRelease assembleFullRelease
    - mkdir -p dist
    - |
      for f in $(find app/build/outputs/apk -name "*release*.apk"); do
        cp "$f" "dist/SpendLens-${CI_COMMIT_TAG:-$CI_COMMIT_SHORT_SHA}-$(basename $f)"
      done
    - rm -f keystore.properties spendlens-release.jks
    - ls -la dist
    # Publish what was actually built, so anyone can check the download.
    - |
      cd dist
      sha256sum *.apk > SHA256SUMS.txt
      cat SHA256SUMS.txt
  artifacts:
    paths:
      - dist/
    expire_in: 1 month

# GitLab releases cannot hold uploaded files the way GitHub releases can, and job
# artifacts expire. Push the APKs into the generic package registry first, so the
# release links to permanent, directly-downloadable URLs.
upload-packages:
  stage: release
  image: curlimages/curl:latest
  # The default before_script provisions the Android SDK. These two jobs run on
  # tiny images with no apt and no JDK, so it has to be turned off or they fail
  # before doing anything.
  before_script: []
  needs: ["assemble"]
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/
  script:
    - |
      for f in dist/*; do
        name=$(basename "$f")
        echo "uploading $name"
        curl --fail --silent --show-error --header "JOB-TOKEN: $CI_JOB_TOKEN" \
          --upload-file "$f" \
          "$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/spendlens/$CI_COMMIT_TAG/$name"
      done

publish-release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  before_script: []
  needs: ["upload-packages"]
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/
  script:
    - echo "Publishing $CI_COMMIT_TAG"
  release:
    tag_name: "$CI_COMMIT_TAG"
    name: "SpendLens $CI_COMMIT_TAG"
    description: |
      See CHANGELOG.md for what changed.

      **Which APK do I want?**

      * `standard` — reads payment notifications. No dangerous permissions. Start here.
      * `full` — also reads bank SMS, which is the only way to recover spending
        from before you installed the app.

      Verify the download against `SHA256SUMS.txt`, linked below.

      Note: these are signed with the project's own key, not F-Droid's. If you
      later install the F-Droid build you will have to uninstall this one first,
      which erases your ledger.
    assets:
      links:
        - name: "SpendLens standard (recommended)"
          url: "$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/spendlens/$CI_COMMIT_TAG/SpendLens-$CI_COMMIT_TAG-app-standard-release.apk"
          link_type: package
        - name: "SpendLens full (adds SMS reading)"
          url: "$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/spendlens/$CI_COMMIT_TAG/SpendLens-$CI_COMMIT_TAG-app-full-release.apk"
          link_type: package
        - name: "SHA256SUMS.txt"
          url: "$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/spendlens/$CI_COMMIT_TAG/SHA256SUMS.txt"
          link_type: other
