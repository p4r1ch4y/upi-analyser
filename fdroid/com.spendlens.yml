# F-Droid build metadata for SpendLens.
#
# This is the file that goes to fdroiddata as `metadata/com.spendlens.yml` in a
# merge request. It lives here so it is versioned alongside the code it builds.
#
# Before opening the merge request:
#   fdroid lint com.spendlens
#   fdroid rewritemeta com.spendlens
#   fdroid build -v -l com.spendlens
#
Categories:
  - Money
License: GPL-3.0-only
AuthorName: Subrata
AuthorEmail: iamcsubrata@gmail.com
AuthorWebSite: https://p4r1ch4y.github.io/
WebSite: https://p4r1ch4y.github.io/
SourceCode: https://gitlab.com/p4r1ch4y-group/SpendLens
IssueTracker: https://gitlab.com/p4r1ch4y-group/SpendLens/-/issues
Changelog: https://gitlab.com/p4r1ch4y-group/SpendLens/-/blob/main/CHANGELOG.md

AutoName: SpendLens

RepoType: git
Repo: https://gitlab.com/p4r1ch4y-group/SpendLens.git

Builds:
  - versionName: 0.1.1-alpha
    versionCode: 2
    commit: v0.1.1-alpha
    subdir: app
    gradle:
      - standard
    # The build server has no keystore.properties, so the release build is left
    # unsigned and F-Droid signs it. Nothing here needs to strip a signing block.

AutoUpdateMode: Version
UpdateCheckMode: Tags
CurrentVersion: 0.1.1-alpha
